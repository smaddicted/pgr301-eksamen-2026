name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: wishifai-51
  DOCKERHUB_REPOSITORY: wishifai-51

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          ECR_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          HUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}
          TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build \
            -t "$ECR_IMAGE:$TAG" -t "$ECR_IMAGE:latest" \
            -t "$HUB_IMAGE:$TAG" -t "$HUB_IMAGE:latest" .
          docker push --all-tags "$ECR_IMAGE"
          docker push --all-tags "$HUB_IMAGE"
